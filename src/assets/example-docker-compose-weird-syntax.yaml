x-app: &app
  image: comlink:local
  build: .
  restart: unless-stopped
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comlink_local}
    POSTGRES_DB: msg_db
    POSTGRES_SSLMODE: disable
    POSTGRES_TIMEZONE: UTC
    KAFKA_PEERS: kafka:9092
  depends_on:
    db:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "8080:8080"

  worker:
    <<: *app
    command: ["/app/worker"]

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comlink_local}
      POSTGRES_DB: msg_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration/000_create_tables.sql:/docker-entrypoint-initdb.d/000_create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports:
      - "9092:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic messages --partitions 1 --replication-factor 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  kafka_data:
  pgdata:

